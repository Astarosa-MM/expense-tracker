name: Test and build expense tracker
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backend behavior
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < public/api.js
          node --input-type=module --check < public/app.js
      - name: Build application package
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-${{ github.run_number }}
          path: dist/expense-tracker.zip
          if-no-files-found: error
